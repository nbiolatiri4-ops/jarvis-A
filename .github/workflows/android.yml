
name: Build JARVIS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Generate JARVIS Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-app/app/src/main/java/com/jarvis/assistant

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.assistant'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.assistant'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.3'
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:label="JARVIS"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/jarvis/assistant/MainActivity.java <<'EOF'
          package com.jarvis.assistant;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private final int gold = Color.rgb(224,195,133);
              private final int black = Color.rgb(8,8,10);
              private TextView output, status;
              private EditText input;
              private TextToSpeech tts;
              private SpeechRecognizer recognizer;
              private boolean ttsReady;
              private SharedPreferences prefs;
              private final ArrayList<String> history = new ArrayList<>();

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(black);
                  getWindow().setNavigationBarColor(black);
                  prefs = getSharedPreferences("jarvis", MODE_PRIVATE);
                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          ttsReady = tts.setLanguage(Locale.getDefault())
                              != TextToSpeech.LANG_MISSING_DATA;
                      }
                  });
                  showHome();
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(22,18,22,16);
                  l.setBackgroundColor(black);
                  return l;
              }

              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(black);
                  b.setBackgroundTintList(ColorStateList.valueOf(gold));
                  return b;
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(5,8,5,8);
                  return t;
              }

              private void showHome() {
                  LinearLayout root = column();
                  TextView title = text("J.A.R.V.I.S",30,gold);
                  title.setTypeface(null,Typeface.BOLD);
                  root.addView(title);
                  root.addView(text("PERSONAL INTELLIGENCE SYSTEM",10,Color.LTGRAY));
                  root.addView(text("●",70,gold));
                  status = text("SYSTEM READY",12,gold);
                  root.addView(status);

                  input = new EditText(this);
                  input.setSingleLine(true);
                  input.setHint("Type a command or ask a question");
                  input.setHintTextColor(Color.GRAY);
                  input.setTextColor(Color.WHITE);
                  input.setTextSize(16);
                  input.setBackgroundTintList(ColorStateList.valueOf(gold));
                  root.addView(input);

                  Button send = button("SEND");
                  send.setOnClickListener(v -> {
                      String s = input.getText().toString().trim();
                      input.setText("");
                      handle(s);
                  });
                  root.addView(send);

                  Button voice = button("TALK TO JARVIS");
                  voice.setOnClickListener(v -> listen());
                  root.addView(voice);

                  Button config = button("AI CONNECTION SETTINGS");
                  config.setOnClickListener(v -> configureAI());
                  root.addView(config);

                  Button notes = button("VIEW SAVED NOTES");
                  notes.setOnClickListener(v -> showNotes());
                  root.addView(notes);

                  output = text("Welcome back.\nType help to see commands.",15,Color.WHITE);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(output);
                  root.addView(scroll,new LinearLayout.LayoutParams(
                      -1,0,1));

                  setContentView(root);
              }

              private void say(String message) {
                  if (output != null) output.setText(message);
                  if (ttsReady && tts != null)
                      tts.speak(message,TextToSpeech.QUEUE_FLUSH,null,"jarvis");
              }

              private void configureAI() {
                  LinearLayout form = new LinearLayout(this);
                  form.setPadding(16,8,16,8);
                  form.setOrientation(LinearLayout.VERTICAL);

                  EditText url = new EditText(this);
                  url.setSingleLine(true);
                  url.setHint("Worker base URL (https://...workers.dev)");
                  url.setText(prefs.getString("worker",""));
                  form.addView(url);

                  EditText token = new EditText(this);
                  token.setSingleLine(true);
                  token.setHint("JARVIS access token");
                  token.setInputType(129);
                  token.setText(prefs.getString("token",""));
                  form.addView(token);

                  new AlertDialog.Builder(this)
                      .setTitle("Connect Cloudflare Worker")
                      .setMessage("Enter your Worker base URL and JARVIS access token. Do not enter your OpenAI API key here.")
                      .setView(form)
                      .setNegativeButton("Cancel",null)
                      .setNeutralButton("Clear", (d,w) ->
                          prefs.edit().remove("worker").remove("token").apply())
                      .setPositiveButton("Save",(d,w) -> {
                          String endpoint = url.getText().toString().trim();
                          String secret = token.getText().toString().trim();
                          if (!endpoint.startsWith("https://")) {
                              say("Use a valid HTTPS Worker URL.");
                              return;
                          }
                          endpoint = endpoint.replaceAll("/+$","");
                          if (endpoint.endsWith("/chat"))
                              endpoint = endpoint.substring(0,endpoint.length()-5);
                          prefs.edit().putString("worker",endpoint)
                              .putString("token",secret).apply();
                          say("AI settings saved. Tap SEND after typing ask followed by your question.");
                      }).show();
              }

              private void askAI(String question) {
                  String base = prefs.getString("worker","");
                  String token = prefs.getString("token","");
                  if (base.isEmpty() || token.isEmpty()) {
                      say("First open AI Connection Settings and enter your Worker URL and access token.");
                      return;
                  }

                  status.setText("CONNECTING TO AI...");
                  output.setText("Thinking...");
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(base + "/chat");
                          conn = (HttpURLConnection)url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(25000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type","application/json");
                          conn.setRequestProperty("Authorization","Bearer " + token);

                          JSONObject body = new JSONObject();
                          body.put("message",question);
                          body.put("history",new JSONArray(history));
                          byte[] bytes = body.toString().getBytes(StandardCharsets.UTF_8);
                          conn.getOutputStream().write(bytes);

                          int code = conn.getResponseCode();
                          InputStream stream = code >= 200 && code < 300
                              ? conn.getInputStream() : conn.getErrorStream();
                          ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                          byte[] data = new byte[2048];
                          int n;
                          while ((n = stream.read(data)) != -1) buffer.write(data,0,n);
                          String raw = buffer.toString("UTF-8");
                          if (code < 200 || code >= 300)
                              throw new Exception("Worker HTTP " + code + ": " + raw);

                          JSONObject json = new JSONObject(raw);
                          String answer = json.optString("reply",
                              json.optString("response",
                              json.optString("text",
                              json.optString("output_text",""))));

                          if (answer.isEmpty() && json.has("choices")) {
                              answer = json.getJSONArray("choices")
                                  .getJSONObject(0).getJSONObject("message")
                                  .optString("content","");
                          }
                          if (answer.isEmpty())
                              throw new Exception("Worker returned no reply. Check its response format.");

                          final String result = answer;
                          runOnUiThread(() -> {
                              status.setText("AI RESPONSE RECEIVED");
                              history.add("User: " + question);
                              history.add("JARVIS: " + result);
                              while (history.size() > 12) history.remove(0);
                              say(result);
                          });
                      } catch (Exception e) {
                          String err = e.getMessage() == null ? "Unknown connection error" : e.getMessage();
                          runOnUiThread(() -> {
                              status.setText("AI CONNECTION FAILED");
                              say("I couldn't reach your AI Worker. " + err);
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      say("Speech recognition is unavailable. Please type.");
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},7);
                      return;
                  }
                  try {
                      if (recognizer != null) recognizer.destroy();
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer.setRecognitionListener(new RecognitionListener() {
                          public void onReadyForSpeech(Bundle b) { say("Listening..."); }
                          public void onResults(Bundle b) {
                              ArrayList<String> matches = b.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  input.setText(matches.get(0));
                                  handle(matches.get(0));
                              } else say("I didn't catch that.");
                          }
                          public void onError(int e) { say("Voice recognition failed. Try again or type."); }
                          public void onBeginningOfSpeech() {}
                          public void onRmsChanged(float v) {}
                          public void onBufferReceived(byte[] b) {}
                          public void onEndOfSpeech() {}
                          public void onPartialResults(Bundle b) {}
                          public void onEvent(int e, Bundle b) {}
                      });
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,Locale.getDefault());
                      i.putExtra(RecognizerIntent.EXTRA_PROMPT,"Speak to JARVIS");
                      recognizer.startListening(i);
                  } catch (Exception e) {
                      say("Could not start voice recognition.");
                  }
              }

              @Override public void onRequestPermissionsResult(int code,
                  String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(code,permissions,results);
                  if (code == 7 && results.length > 0 &&
                      results[0] == PackageManager.PERMISSION_GRANTED) listen();
                  else if (code == 7) say("Microphone permission denied.");
              }

              private void handle(String raw) {
                  if (raw == null || raw.trim().isEmpty()) {
                      say("Please type a command.");
                      return;
                  }
                  String c = raw.trim().toLowerCase(Locale.ROOT);

                  InputMethodManager imm = (InputMethodManager)
                      getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null && input != null)
                      imm.hideSoftInputFromWindow(input.getWindowToken(),0);

                  if (c.equals("help")) {
                      say("Commands: time, date, settings, wifi, bluetooth, camera, dialer, open YouTube, open Chrome, open WhatsApp, remember followed by a note, recall notes, and ask followed by a question.");
                      return;
                  }

                  if (c.equals("time") || c.equals("date") || c.contains("what time")) {
                      say(new SimpleDateFormat("EEEE, d MMMM yyyy, hh:mm a",
                          Locale.getDefault()).format(new Date()));
                      return;
                  }

                  if (c.equals("settings") || c.contains("phone settings")) {
                      openIntent(new Intent(Settings.ACTION_SETTINGS),"Opening settings.");
                      return;
                  }
                  if (c.contains("wifi") || c.contains("wi-fi")) {
                      openIntent(new Intent(Settings.ACTION_WIFI_SETTINGS),"Opening Wi-Fi settings.");
                      return;
                  }
                  if (c.contains("bluetooth")) {
                      openIntent(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS),"Opening Bluetooth settings.");
                      return;
                  }
                  if (c.cont
