
name: Build JARVIS Android App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/jarvis/assistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.assistant'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.assistant'
                  minSdk 23
                  targetSdk 32
                  versionCode 3
                  versionName '1.3'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <queries>
                  <package android:name="com.whatsapp"/>
                  <package android:name="com.android.chrome"/>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/assistant/MainActivity.java <<'EOF'
          package com.jarvis.assistant;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.RecognitionListener;
          import android.speech.tts.TextToSpeech;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import org.json.*;
          import java.net.*;
          import java.io.*;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              int gold = Color.rgb(226, 190, 120);
              int bg = Color.rgb(8, 9, 13);
              TextView answer, status;
              EditText input;
              LinearLayout root, messages;
              TextToSpeech tts;
              SpeechRecognizer recognizer;
              String workerUrl = "";
              String accessToken = "";
              boolean speaking = true;
              boolean busy = false;
              final ArrayList<String> history = new ArrayList<>();
              android.content.SharedPreferences prefs;

              public void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);

                  prefs = getSharedPreferences("jarvis", MODE_PRIVATE);
                  workerUrl = prefs.getString("url", "");
                  accessToken = prefs.getString("token", "");

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS)
                          tts.setLanguage(Locale.US);
                  });

                  buildUI();
                  showReply("JARVIS online. How can I help you?");
              }

              GradientDrawable shape(int color, int radius, int stroke) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(radius);
                  if (stroke > 0) d.setStroke(1, gold);
                  return d;
              }

              TextView text(String s, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              void buildUI() {
                  ScrollView scroll = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(22, 20, 22, 16);
                  root.setBackgroundColor(bg);
                  scroll.setFillViewport(true);
                  scroll.addView(root);
                  setContentView(scroll);

                  TextView title = text("J A R V I S", 25, gold);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title, new LinearLayout.LayoutParams(-1, 55));

                  TextView sub = text("PERSONAL AI ASSISTANT", 11, Color.LTGRAY);
                  root.addView(sub);

                  TextView orb = text("✦", 64, gold);
                  orb.setBackground(shape(Color.rgb(20, 19, 23), 300, 2));
                  LinearLayout.LayoutParams op = new LinearLayout.LayoutParams(190, 190);
                  op.gravity = Gravity.CENTER;
                  op.setMargins(0, 30, 0, 20);
                  root.addView(orb, op);

                  status = text("SYSTEM READY", 12, gold);
                  root.addView(status);

                  answer = new TextView(this);
                  answer.setTextColor(Color.WHITE);
                  answer.setTextSize(16);
                  answer.setPadding(16, 18, 16, 18);
                  answer.setBackground(shape(Color.rgb(19, 20, 26), 18, 1));
                  LinearLayout.LayoutParams ap = new LinearLayout.LayoutParams(-1, -2);
                  ap.setMargins(0, 24, 0, 18);
                  root.addView(answer, ap);

                  input = new EditText(this);
                  input.setSingleLine(false);
                  input.setMinLines(1);
                  input.setMaxLines(3);
                  input.setTextColor(Color.WHITE);
                  input.setHintTextColor(Color.GRAY);
                  input.setHint("Ask JARVIS anything...");
                  input.setPadding(14, 12, 14, 12);
                  input.setBackground(shape(Color.rgb(26, 27, 33), 15, 1));
                  root.addView(input, new LinearLayout.LayoutParams(-1, -2));

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  buttons.setGravity(Gravity.CENTER);
                  buttons.setPadding(0, 12, 0, 8);
                  root.addView(buttons);

                  addButton(buttons, "ASK", () -> submit());
                  addButton(buttons, "🎙 VOICE", () -> listen());
                  addButton(buttons, "SETTINGS", () -> settings());

                  LinearLayout quick = new LinearLayout(this);
                  quick.setOrientation(LinearLayout.HORIZONTAL);
                  root.addView(quick);
                  addButton(quick, "TIME", () -> command("what time is it"));
                  addButton(quick, "NOTES", () -> notes());
                  addButton(quick, "HELP", () -> help());

                  TextView foot = text("PRIVATE PROTOTYPE • BLACK / GOLD", 10,
                      Color.GRAY);
                  root.addView(foot);
              }

              void addButton(LinearLayout parent, String label, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(10);
                  b.setTextColor(gold);
                  b.setAllCaps(false);
                  b.setBackground(shape(Color.rgb(28, 27, 30), 14, 1));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      0, 52, 1);
                  p.setMargins(3, 3, 3, 3);
                  parent.addView(b, p);
                  b.setOnClickListener(v -> action.run());
              }

              void showReply(String s) {
                  answer.setText(s);
              }

              void say(String s) {
                  if (speaking && tts != null)
                      tts.speak(s, TextToSpeech.QUEUE_FLUSH, null, "jarvis_reply");
              }

              void respond(String s) {
                  showReply(s);
                  say(s);
                  status.setText("SYSTEM READY");
              }

              void submit() {
                  String q = input.getText().toString().trim();
                  if (q.isEmpty()) return;
                  input.setText("");
                  ((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE))
                      .hideSoftInputFromWindow(input.getWindowToken(), 0);
                  command(q);
              }

              void command(String original) {
                  String q = original.toLowerCase(Locale.ROOT).trim();

                  if (q.contains("what time") || q.equals("time")) {
                      respond("The time is " +
                          new SimpleDateFormat("h:mm a", Locale.getDefault())
                          .format(new Date()));
                      return;
                  }
                  if (q.contains("what date") || q.contains("today's date")
                      || q.equals("date")) {
                      respond("Today is " +
                          new SimpleDateFormat("EEEE, d MMMM yyyy",
                          Locale.getDefault()).format(new Date()));
                      return;
                  }
                  if (q.equals("help") || q.contains("what can you do")) {
                      help();
                      return;
                  }
                  if (q.contains("open calculator")) {
                      launchIntent(new Intent("android.intent.action.MAIN")
                          .addCategory("android.intent.category.APP_CALCULATOR"),
                          "I could not find a calculator app.");
                      return;
                  }
                  if (q.contains("open camera")) {
                      launchIntent(new Intent("android.media.action.IMAGE_CAPTURE"),
                          "I could not open the camera.");
                      return;
                  }
                  if (q.contains("open settings")) {
                      launchIntent(new Intent(android.provider.Settings.ACTION_SETTINGS),
                          "I could not open Settings.");
                      return;
                  }
                  if (q.contains("open bluetooth")) {
                      launchIntent(new Intent(android.provider.Settings
                          .ACTION_BLUETOOTH_SETTINGS),
                          "I could not open Bluetooth settings.");
                      return;
                  }
                  if (q.contains("open wi-fi") || q.contains("open wifi")) {
                      launchIntent(new Intent(android.provider.Settings
                          .ACTION_WIFI_SETTINGS),
                          "I could not open Wi-Fi settings.");
                      return;
                  }
                  if (q.contains("open youtube")) {
                      launchIntent(new Intent(Intent.ACTION_VIEW,
                          Uri.parse("https://www.youtube.com")),
                          "Could not open YouTube.");
                      return;
                  }
                  if (q.contains("open chrome")) {
                      launchIntent(new Intent(Intent.ACTION_VIEW,
                          Uri.parse("https://www.google.com")),
                          "Could not open a browser.");
                      return;
                  }
                  if (q.contains("open whatsapp")) {
                      Intent i = getPackageManager()
                          .getLaunchIntentForPackage("com.whatsapp");
                      if (i == null) respond("WhatsApp was not found.");
                      else launchIntent(i, "Could not open WhatsApp.");
                      return;
                  }
                  if (q.startsWith("note ")) {
                      saveNote(original.substring(5).trim());
                      return;
                  }
                  if (q.contains("show notes") || q.equals("notes")) {
                      notes();
                      return;
                  }
                  if (q.contains("stop talking") || q.contains("mute")) {
                      speaking = false;
                      if (tts != null) tts.stop();
                      showReply("Voice replies muted. Type a command to continue.");
                      return;
                  }
                  if (q.contains("speak again") || q.contains("unmute")) {
                      speaking = true;
                      respond("Voice replies enabled.");
                      return;
                  }
                  askAI(original);
              }

              void launchIntent(Intent i, String error) {
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      respond("Opening it now.");
                  } catch (Exception e) {
                      respond(error);
                  }
              }

              void saveNote(String note) {
                  if (note.isEmpty()) {
                      respond("Tell me what you want to save. Say: note followed by your note.");
                      return;
                  }
                  Set<String> old = new HashSet<>(prefs.getStringSet("notes",
                      new HashSet<>()));
                  old.add(new SimpleDateFormat("yyyy-MM-dd HH:mm",
                      Locale.getDefault()).format(new Date()) + " — " + note);
                  prefs.edit().putStringSet("notes", old).apply();
                  respond("Note saved on this phone.");
              }

              void notes() {
                  Set<String> n = prefs.getStringSet("notes", new HashSet<>());
                  if (n.isEmpty()) {
                      respond("You have no saved notes. Type note followed by your note.");
                      return;
                  }
                  StringBuilder b = new StringBuilder("YOUR NOTES\n\n");
                  for (String s : n) b.append("• ").append(s).append("\n\n");
                  respond(b.toString());
              }

              void help() {
                  respond("I can tell you the time and date, save notes, open supported phone settings, launch your camera, browser, YouTube or WhatsApp, and answer questions using your configured AI backend. Tap VOICE to speak. AI needs an internet connection and valid backend settings.");
              }

              void listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      respond("Speech recognition is unavailable on this phone.");
                      return;
                  }
                  try {
                      if (recognizer != null) recognizer.destroy();
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer.setRecognitionListener(new RecognitionListener() {
                          public void onReadyForSpeech(Bundle b) {
                              status.setText("LISTENING...");
                          }
                          public void onBeginningOfSpeech() {}
                          public void onRmsChanged(float f) {}
                          public void onBufferReceived(byte[] b) {}
                          public void onEndOfSpeech() {
                              status.setText("PROCESSING...");
                          }
                          public void onError(int e) {
                              status.setText("SYSTEM READY");
                              showReply("I couldn't hear that clearly. Check microphone permission and try again.");
                          }
                          public void onResults(Bundle b) {
                              ArrayList<String> r = b.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION);
                              if (r != null && !r.isEmpty()) {
                                  input.setText(r.get(0));
                                  command(r.get(0));
                              }
                          }
                          public void onPartialResults(Bundle b) {}
                          public void onEvent(int a, Bundle b) {}
                        });
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                      recognizer.startListening(i);
                  } catch (Exception e) {
                      respond("Voice recognition could not start.");
                  }
              }

              void settings() {
                  LinearLayout box = new LinearLayout(this);
                  box.setPadding(12, 4, 12, 4);
                  box.setOrientation(LinearLayout.VERTICAL);

                  EditText url = new EditText(this);
                  url.setSingleLine(true);
                  url.setHint("Cloudflare Worker URL ending in /chat");
                  url.setText(workerUrl);
                  
